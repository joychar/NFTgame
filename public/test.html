    <div class="container">
        <div class="jbody">

            <div class="jiange"></div>

                    <div class="option">
                        <input  value="option1" name="btn" type="radio" class="input" onclick="window.location.href='index.html'" />

                    </div>
                    <div class="option">
                        <input value="option2" name="btn" type="radio" class="input" onclick="window.location.href='my.html'" />
                        <div class="btn">
                            <span class="span">我的</span>

                    </div>
                    <div class="option">
                        <input checked="" value="option3" name="btn" type="radio" class="input" onclick="window.location.href='mint.html'" />
                        <div class="btn">
                            <span class="span">铸造</span>

                    </div>

            <div class="welcome">

                        <div class="text">

                    </label>
                </div>

                <div class="box UP">
                    <button class="mint-button" onclick="mint()"> 铸造</button>
                </div>
            </div>
            <button onclick="heyue()">点击</button>

<!-- 图片裁剪 -->
    <div id="overlay"></div>
    <div id="cropModal">
        <div class="modal-content">
            <img id="imageToCrop" src="" alt="Image to Crop">
            <div class="modal-buttons">
                <button id="cropButton">裁剪</button>
                <button id="cancelButton">取消</button>
            </div>
        </div>
    </div>
