<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/my.css">
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script> 
    <script src="/js/connect.js"></script>
    <script src="/js/contract.js"></script>
    <script src="/js/ChainInfo.js"></script>
    <script src="/js/my.js"></script>
</head>
<body>
    <div class="container">
        <div class="jbody">

            <div class="jiange"></div>
            
            <div class="daohang">
                <div class="wrapper">
                    <div class="option">
                        <input  value="option1" name="btn" type="radio" class="input" onclick="window.location.href='index.html'" />
                        <div class="btn">
                            <span class="span">首页</span>
                        </div>
                    </div>
                    <div class="option">
                        <input checked="" value="option2" name="btn" type="radio" class="input" onclick="window.location.href='my.html'" />
                        <div class="btn">
                            <span class="span">我的</span>
                        </div>
                    </div>
                    <div class="option">
                        <input value="option3" name="btn" type="radio" class="input" onclick="window.location.href='mint.html'" />
                        <div class="btn">
                            <span class="span">铸造</span>
                        </div>
                    </div>
                </div>

                <div class="connect">
                    <button onclick="connectWallet()" class="connect-button">
                        <span>
                        <svg width="23" height="24" viewbox="0 0 23 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.125 17.75V18.7083C20.125 19.2167 19.9231 19.7042 19.5636 20.0636C19.2042 20.4231 18.7167 20.625 18.2083 20.625H4.79167C3.72792 20.625 2.875 19.7625 2.875 18.7083V5.29167C2.875 4.78333 3.07693 4.29582 3.43638 3.93638C3.79582 3.57693 4.28334 3.375 4.79167 3.375H18.2083C18.7167 3.375 19.2042 3.57693 19.5636 3.93638C19.9231 4.29582 20.125 4.78333 20.125 5.29167V6.25H11.5C10.4363 6.25 9.58333 7.1125 9.58333 8.16667V15.8333C9.58333 16.3417 9.78527 16.8292 10.1447 17.1886C10.5042 17.5481 10.9917 17.75 11.5 17.75H20.125ZM11.5 15.8333H21.0833V8.16667H11.5V15.8333ZM15.3333 13.4375C14.9521 13.4375 14.5865 13.286 14.3169 13.0165C14.0473 12.7469 13.8958 12.3812 13.8958 12C13.8958 11.6188 14.0473 11.2531 14.3169 10.9835C14.5865 10.714 14.9521 10.5625 15.3333 10.5625C15.7146 10.5625 16.0802 10.714 16.3498 10.9835C16.6194 11.2531 16.7708 11.6188 16.7708 12C16.7708 12.3812 16.6194 12.7469 16.3498 13.0165C16.0802 13.286 15.7146 13.4375 15.3333 13.4375Z" fill="white"></path>
                        </svg>
                        </span>
                        <span class="contest"><span id="walletAddress" >Connect</span></span>
                    </button>
                </div>
            </div>

            <div class="jiange"></div>

            <div class="welcome">
                <div class="ILIKEYOU">HI ! I LIKE YOU ♥</div>
            </div>

            <div class="jiange"></div>

            <div class="myNFT">
                <div class="myNFTList">
                </div>
            </div>
        </div>
    </div>

    <div id="transferModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Transfer NFT</h2>
            <form id="transferForm">
                <label for="recipientAddress" class="recaddress">Recipient Address:</label>
                <input type="text" id="recipientAddress" name="recipientAddress" required style="width: 400px; height: 20px;">
                <button class="button-submit" type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
